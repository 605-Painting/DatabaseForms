<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>605 Painting Lead Upload</title>
  <style>
    :root {
      --brand: #5a2ca0;
      --brand-dark: #45207e;
      --bg: #f4f1fb;
      --card: #ffffff;
      --text: #1f2937;
      --border: #d1d5db;
      --error: #b91c1c;
      --success: #166534;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, var(--bg), #ffffff);
      color: var(--text);
      padding: 24px;
    }

    .wrapper {
      max-width: 560px;
      margin: 0 auto;
    }

    .card {
      background: var(--card);
      border-radius: 20px;
      box-shadow: 0 16px 40px rgba(31, 41, 55, 0.12);
      border: 1px solid rgba(90, 44, 160, 0.12);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, var(--brand), var(--brand-dark));
      color: white;
      padding: 24px;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
    }

    form {
      padding: 24px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-weight: 700;
      font-size: 14px;
    }

    .required {
      color: var(--error);
      margin-left: 4px;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 15px;
      background: white;
      color: var(--text);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: var(--brand);
      box-shadow: 0 0 0 4px rgba(90, 44, 160, 0.12);
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 14px 20px;
      background: var(--brand);
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, background 0.2s;
    }

    button:hover {
      background: var(--brand-dark);
      transform: translateY(-1px);
    }

    .status {
      font-size: 14px;
      font-weight: 700;
    }

    .status.success { color: var(--success); }
    .status.error { color: var(--error); }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="card">
      <div class="header">
        <h1>605 Painting Lead Upload</h1>
      </div>

      <form id="leadForm" novalidate>
        <div class="grid">
          <div class="field">
            <label for="firstName">First Name<span class="required">*</span></label>
            <input id="firstName" name="first_name" type="text" required autocomplete="given-name">
          </div>

          <div class="field">
            <label for="lastName">Last Name<span class="required">*</span></label>
            <input id="lastName" name="last_name" type="text" required autocomplete="family-name">
          </div>

          <div class="field">
            <label for="phone">Phone Number<span class="required">*</span></label>
            <input id="phone" name="phone" type="tel" inputmode="numeric" maxlength="14" placeholder="(605) 555-1234" required autocomplete="tel">
          </div>

          <div class="field">
            <label for="notes">Notes</label>
            <textarea id="notes" name="notes"></textarea>
          </div>
        </div>

        <div class="actions">
          <button type="submit">Upload Lead</button>
          <span id="formStatus" class="status"></span>
        </div>
      </form>
    </div>
  </div>

  <script>
    const form = document.getElementById('leadForm');
    const phoneInput = document.getElementById('phone');
    const formStatus = document.getElementById('formStatus');

    function formatPhone(value) {
      const digits = value.replace(/\D/g, '').slice(0, 10);
      if (digits.length < 4) return digits;
      if (digits.length < 7) return `(${digits.slice(0, 3)}) ${digits.slice(3)}`;
      return `(${digits.slice(0, 3)}) ${digits.slice(3, 6)}-${digits.slice(6, 10)}`;
    }

    phoneInput.addEventListener('input', () => {
      phoneInput.value = formatPhone(phoneInput.value);
    });

    form.addEventListener('submit', (event) => {
      if (!form.checkValidity()) {
        event.preventDefault();
        form.reportValidity();
        formStatus.textContent = 'Please fix the required fields and try again.';
        formStatus.className = 'status error';
        return;
      }

      event.preventDefault();
      const formData = new FormData(form);
      const payload = Object.fromEntries(formData.entries());
      console.log('Lead submission payload:', payload);
      formStatus.textContent = 'Lead is valid and ready to submit.';
      formStatus.className = 'status success';
    });
  </script>
</body>
</html>
