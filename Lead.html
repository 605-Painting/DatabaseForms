<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>605 Painting Lead Upload</title>
  <style>
    :root {
      --brand: #5a2ca0;
      --brand-dark: #45207e;
      --bg: #f4f1fb;
      --card: #ffffff;
      --text: #1f2937;
      --border: #d1d5db;
      --error: #b91c1c;
      --success: #166534;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, var(--bg), #ffffff);
      color: var(--text);
      padding: 24px;
    }

    .wrapper {
      max-width: 860px;
      margin: 0 auto;
    }

    .card {
      background: var(--card);
      border-radius: 20px;
      box-shadow: 0 16px 40px rgba(31, 41, 55, 0.12);
      overflow: hidden;
      border: 1px solid rgba(90, 44, 160, 0.12);
    }

    .header {
      background: linear-gradient(135deg, var(--brand), var(--brand-dark));
      color: white;
      padding: 28px 24px;
      display: flex;
      gap: 18px;
      align-items: center;
    }

    .header h1 {
      margin: 0;
      font-size: 30px;
    }

    form {
      padding: 24px;
    }

    .section-title {
      margin: 8px 0 16px;
      font-size: 18px;
      color: var(--brand-dark);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 18px;
    }

    .field,
    .full {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .full {
      grid-column: 1 / -1;
    }

    label {
      font-weight: 700;
      font-size: 14px;
    }

    .required {
      color: var(--error);
      margin-left: 4px;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 15px;
      background: white;
      color: var(--text);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: var(--brand);
      box-shadow: 0 0 0 4px rgba(90, 44, 160, 0.12);
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 14px 20px;
      background: var(--brand);
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, background 0.2s;
    }

    button:hover {
      background: var(--brand-dark);
      transform: translateY(-1px);
    }

    .status {
      font-size: 14px;
      font-weight: 700;
    }

    .status.success { color: var(--success); }
    .status.error { color: var(--error); }

    @media (max-width: 720px) {
      body { padding: 14px; }
      .header {
        flex-direction: column;
        text-align: center;
      }
      .grid {
        grid-template-columns: 1fr;
      }
      .full {
        grid-column: auto;
      }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="card">
      <div class="header">
        <div>
          <h1>605 Painting Lead Upload</h1>
        </div>
      </div>

      <form
        id="leadUpload"
        method="POST"
        action="https://hooks.zapier.com/hooks/catch/19735178/u7yb79j/"
        novalidate
      >
        <div class="section-title">Lead Information</div>
        <div class="grid">
          <div class="field">
            <label for="firstName">First Name<span class="required">*</span></label>
            <input id="firstName" name="first_name" type="text" required autocomplete="given-name">
          </div>

          <div class="field">
            <label for="lastName">Last Name<span class="required">*</span></label>
            <input id="lastName" name="last_name" type="text" required autocomplete="family-name">
          </div>

          <div class="field">
            <label for="email">Email<span class="required">*</span></label>
            <input id="email" name="email" type="email" required autocomplete="email">
          </div>

          <div class="field">
            <label for="phone">Phone<span class="required">*</span></label>
            <input id="phone" name="phone" type="tel" inputmode="numeric" maxlength="14" placeholder="(605) 555-1234" required autocomplete="tel">
          </div>

          <div class="full">
            <label for="additionalNotes">Additional Notes</label>
            <textarea id="additionalNotes" name="additional_notes"></textarea>
          </div>
        </div>

        <input type="hidden" id="hiddenSetAppointment" name="set_appointment" value="No">
         <input type="hidden" id="hiddenCommercialLead" name="commercial_lead" value="No">
        <input type="hidden" id="hiddenDripjobsStart" name="dripjobs_start_time" value="">
        <input type="hidden" id="hiddenDripjobsEnd" name="dripjobs_end_time" value="">
        <input type="hidden" id="hiddenTimestamp" name="submission_timestamp">
        <input type="hidden" id="hiddenFullAddress" name="full_address" value="">
        <input type="hidden" id="urlEmployee" name="url_employee">

        <div class="actions">
          <button type="submit">Upload Lead</button>
          <span id="formStatus" class="status"></span>
        </div>
      </form>
    </div>
  </div>

  <script>
    const form = document.getElementById('leadUpload');
    const phoneInput = document.getElementById('phone');
    const formStatus = document.getElementById('formStatus');
    const hiddenDripjobsStart = document.getElementById('hiddenDripjobsStart');
    const hiddenDripjobsEnd = document.getElementById('hiddenDripjobsEnd');
    const hiddenTimestamp = document.getElementById('hiddenTimestamp');
    const hiddenFullAddress = document.getElementById('hiddenFullAddress');
    const hiddenUrlEmployee = document.getElementById('urlEmployee');

    const params = new URLSearchParams(window.location.search);
    let employeeFromUrl = params.get('employee');

    if (!employeeFromUrl) {
      const rawQuery = window.location.search.slice(1).trim();
      if (rawQuery && !rawQuery.includes('=')) {
        employeeFromUrl = decodeURIComponent(rawQuery);
      }
    }

    if (hiddenUrlEmployee && employeeFromUrl) {
      hiddenUrlEmployee.value = employeeFromUrl;
    }

    function formatPhone(value) {
      const digits = value.replace(/\D/g, '').slice(0, 10);
      if (digits.length < 4) return digits;
      if (digits.length < 7) return `(${digits.slice(0, 3)}) ${digits.slice(3)}`;
      return `(${digits.slice(0, 3)}) ${digits.slice(3, 6)}-${digits.slice(6, 10)}`;
    }

    function getCompactTimestamp() {
      const now = new Date();
      const yy = String(now.getFullYear()).slice(-2);
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const hh = String(now.getHours()).padStart(2, '0');
      const min = String(now.getMinutes()).padStart(2, '0');
      const ss = String(now.getSeconds()).padStart(2, '0');
      return `${yy}${mm}${dd}-${hh}${min}${ss}`;
    }

    phoneInput.addEventListener('input', () => {
      phoneInput.value = formatPhone(phoneInput.value);
    });

    form.addEventListener('submit', (event) => {
      if (!form.checkValidity()) {
        event.preventDefault();
        form.reportValidity();
        formStatus.textContent = 'Please fix the required fields and try again.';
        formStatus.className = 'status error';
        return;
      }

      hiddenDripjobsStart.value = '';
      hiddenDripjobsEnd.value = '';
      hiddenTimestamp.value = getCompactTimestamp();
      hiddenFullAddress.value = '';

      formStatus.textContent = 'Submitting...';
      formStatus.className = 'status success';
    });
  </script>
</body>
</html>
