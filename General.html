<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>605 Painting Appointment Booking</title>
  <style>
    :root {
      --brand: #5a2ca0;
      --brand-dark: #45207e;
      --bg: #f4f1fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #d1d5db;
      --error: #b91c1c;
      --success: #166534;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, var(--bg), #ffffff);
      color: var(--text);
      padding: 24px;
    }

    .wrapper {
      max-width: 860px;
      margin: 0 auto;
    }

    .card {
      background: var(--card);
      border-radius: 20px;
      box-shadow: 0 16px 40px rgba(31, 41, 55, 0.12);
      overflow: hidden;
      border: 1px solid rgba(90, 44, 160, 0.12);
    }

    .header {
      background: linear-gradient(135deg, var(--brand), var(--brand-dark));
      color: white;
      padding: 28px 24px;
      display: flex;
      gap: 18px;
      align-items: center;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    form {
      padding: 24px;
    }

    .section-title {
      margin: 8px 0 16px;
      font-size: 18px;
      color: var(--brand-dark);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 18px;
    }

    .field,
    .full {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .full {
      grid-column: 1 / -1;
    }

    label {
      font-weight: 700;
      font-size: 14px;
    }

    .required {
      color: var(--error);
      margin-left: 4px;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 15px;
      background: white;
      color: var(--text);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: var(--brand);
      box-shadow: 0 0 0 4px rgba(90, 44, 160, 0.12);
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 14px 20px;
      background: var(--brand);
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, background 0.2s;
    }

    button:hover {
      background: var(--brand-dark);
      transform: translateY(-1px);
    }

    .status {
      font-size: 14px;
      font-weight: 700;
    }

    .status.success { color: var(--success); }
    .status.error { color: var(--error); }

    @media (max-width: 720px) {
      body { padding: 14px; }
      .header {
        flex-direction: column;
        text-align: center;
      }
      .grid {
        grid-template-columns: 1fr;
      }
      .full {
        grid-column: auto;
      }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="card">
      <div class="header">
        <div>
          <h1>605 Painting Appointment Booking</h1>
        </div>
      </div>

      <form
        id="bookingForm"
        method="POST"
        action="https://hooks.zapier.com/hooks/catch/19735178/u7yb79j/"
        novalidate
      >
        <div class="section-title">Lead Information</div>
        <div class="grid">
          <div class="field">
            <label for="leadSource">Lead Source<span class="required">*</span></label>
            <select id="leadSource" name="lead_source" required>
              <option value="">Select lead source</option>
              <option>Facebook</option>
              <option>Instagram</option>
              <option>Repeat Customer</option>
              <option>The Local Best</option>
              <option>Sherwin Williams</option>
              <option>Norbergs</option>
              <option>Door Hanger</option>
              <option>Internet Search</option>
              <option>AI / ChatGPT</option>
              <option>Yelp</option>
              <option>LinkedIn</option>
              <option>Yard Sign</option>
              <option>Company Vehicles</option>
              <option>Direct Mail</option>
              <option>Door Knocking &amp; Hanging</option>
              <option>Flyer</option>
              <option>Home Show</option>
              <option>Our Office Building</option>
              <option>Referral / Sales Rep</option>
              <option>Monumental Growth</option>
              <option>Ride The Wave</option>
            </select>
          </div>

          <div class="field">
            <label for="appointmentDate">Appointment Date<span class="required">*</span></label>
            <input id="appointmentDate" name="appointment_date" type="date" required>
          </div>

          <div class="field">
            <label for="firstName">First Name<span class="required">*</span></label>
            <input id="firstName" name="first_name" type="text" required autocomplete="given-name">
          </div>

          <div class="field">
            <label for="lastName">Last Name<span class="required">*</span></label>
            <input id="lastName" name="last_name" type="text" required autocomplete="family-name">
          </div>

          <div class="field">
            <label for="email">Email<span class="required">*</span></label>
            <input id="email" name="email" type="email" required autocomplete="email">
          </div>

          <div class="field">
            <label for="phone">Phone<span class="required">*</span></label>
            <input id="phone" name="phone" type="tel" inputmode="numeric" maxlength="14" placeholder="(605) 555-1234" required autocomplete="tel">
          </div>

          <div class="full">
            <label for="streetAddress">Street Address<span class="required">*</span></label>
            <input id="streetAddress" name="street_address" type="text" required autocomplete="address-line1" placeholder="123 Main St">
          </div>

          <div class="field">
            <label for="city">City<span class="required">*</span></label>
            <input id="city" name="city" type="text" required autocomplete="address-level2" placeholder="Sioux Falls">
          </div>

          <div class="field">
            <label for="state">State<span class="required">*</span></label>
            <input id="state" name="state" type="text" required maxlength="2" autocomplete="address-level1" placeholder="SD">
          </div>

          <div class="field">
            <label for="zip">Zip<span class="required">*</span></label>
            <input id="zip" name="zip" type="text" required inputmode="numeric" maxlength="10" autocomplete="postal-code" placeholder="57104">
          </div>
        </div>

        <div class="section-title">Appointment Details</div>
        <div class="grid">
          <div class="field">
            <label for="startTime">Start Time<span class="required">*</span></label>
            <select id="startTime" name="start_time" required>
              <option value="">Select start time</option>
              <option value="09:00">9:00am</option>
              <option value="11:00">11:00am</option>
              <option value="13:00">1:00pm</option>
              <option value="15:00">3:00pm</option>
              <option value="17:00">5:00pm</option>
            </select>
          </div>

          <div class="field">
            <label for="twoLeg">2 leg</label>
            <select id="twoLeg" name="two_leg">
              <option value="">Select option</option>
              <option>Yes</option>
              <option>No</option>
            </select>
          </div>

          <div class="full">
            <label for="appointmentNeeds">Please describe what the homeowner wants us to look at<span class="required">*</span></label>
            <textarea id="appointmentNeeds" name="appointment_needs" required></textarea>
          </div>

          <div class="full">
            <label for="areasOfConcern">Areas of concern</label>
            <textarea id="areasOfConcern" name="areas_of_concern"></textarea>
          </div>

          <div class="full">
            <label for="additionalNotes">Additional notes</label>
            <textarea id="additionalNotes" name="additional_notes"></textarea>
          </div>
        </div>

        <div class="section-title">Other Party</div>
        <div class="grid">
          <div class="field">
            <label for="otherPartyName">Other party name</label>
            <input id="otherPartyName" name="other_party_name" type="text">
          </div>

          <div class="field">
            <label for="otherPartyRelation">Other party relation to homeowner</label>
            <input id="otherPartyRelation" name="other_party_relation" type="text">
          </div>

          <div class="field">
            <label for="otherPartyPhone">Other party phone number</label>
            <input id="otherPartyPhone" name="other_party_phone" type="tel" inputmode="numeric" maxlength="14" placeholder="(605) 555-1234">
          </div>
        </div>

        <input type="hidden" id="hiddenSetAppointment" name="set_appointment" value="Yes">
        <input type="hidden" id="hiddenDripjobsStart" name="dripjobs_start_time">
        <input type="hidden" id="hiddenDripjobsEnd" name="dripjobs_end_time">
        <input type="hidden" id="hiddenTimestamp" name="submission_timestamp">
        <input type="hidden" id="hiddenFullAddress" name="full_address">
        <input type="hidden" id="urlEmployee" name="url_employee">

        <div class="actions">
          <button type="submit">Book Appointment</button>
          <span id="formStatus" class="status"></span>
        </div>
      </form>
    </div>
  </div>

  <script>
    const form = document.getElementById('bookingForm');
    const phoneInput = document.getElementById('phone');
    const otherPartyPhoneInput = document.getElementById('otherPartyPhone');
    const appointmentDateInput = document.getElementById('appointmentDate');
    const startTimeInput = document.getElementById('startTime');
    const streetAddressInput = document.getElementById('streetAddress');
    const cityInput = document.getElementById('city');
    const stateInput = document.getElementById('state');
    const zipInput = document.getElementById('zip');
    const formStatus = document.getElementById('formStatus');
    const hiddenDripjobsStart = document.getElementById('hiddenDripjobsStart');
    const hiddenDripjobsEnd = document.getElementById('hiddenDripjobsEnd');
    const hiddenTimestamp = document.getElementById('hiddenTimestamp');
    const hiddenFullAddress = document.getElementById('hiddenFullAddress');
    const params = new URLSearchParams(window.location.search);
    const employeeFromUrl = params.get('employee');

if (employeeFromUrl) {
  const employeeField = document.getElementById('employee'); // if you have a dropdown
  const hiddenUrlEmployee = document.getElementById('urlEmployee'); // hidden field

  if (employeeField) {
    employeeField.value = employeeFromUrl;
    // Optional: lock it
    // employeeField.setAttribute('disabled', 'disabled');
  }

  if (hiddenUrlEmployee) {
    hiddenUrlEmployee.value = employeeFromUrl;
  }
}

    function formatPhone(value) {
      const digits = value.replace(/\D/g, '').slice(0, 10);
      if (digits.length < 4) return digits;
      if (digits.length < 7) return `(${digits.slice(0, 3)}) ${digits.slice(3)}`;
      return `(${digits.slice(0, 3)}) ${digits.slice(3, 6)}-${digits.slice(6, 10)}`;
    }

    function wirePhoneFormatting(input) {
      input.addEventListener('input', () => {
        input.value = formatPhone(input.value);
      });
    }

    function pad(num) {
      return String(num).padStart(2, '0');
    }

    function toDripjobsFormat(date) {
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
    }

    function getCompactTimestamp() {
      const now = new Date();
      const yy = String(now.getFullYear()).slice(-2);
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const hh = String(now.getHours()).padStart(2, '0');
      const min = String(now.getMinutes()).padStart(2, '0');
      const ss = String(now.getSeconds()).padStart(2, '0');
      return `${yy}${mm}${dd}-${hh}${min}${ss}`;
    }

    function getDerivedTimes() {
      const dateValue = appointmentDateInput.value;
      const timeValue = startTimeInput.value;

      if (!dateValue || !timeValue) {
        return { start: '', end: '' };
      }

      const start = new Date(`${dateValue}T${timeValue}:00`);
      if (Number.isNaN(start.getTime())) {
        return { start: '', end: '' };
      }

      const end = new Date(start.getTime() + 90 * 60 * 1000);
      return {
        start: toDripjobsFormat(start),
        end: toDripjobsFormat(end)
      };
    }

    function validateAddressParts() {
      const street = streetAddressInput.value.trim();
      const city = cityInput.value.trim();
      const state = stateInput.value.trim();
      const zip = zipInput.value.trim();

      streetAddressInput.setCustomValidity('');
      cityInput.setCustomValidity('');
      stateInput.setCustomValidity('');
      zipInput.setCustomValidity('');

      if (street.length < 4) {
        streetAddressInput.setCustomValidity('Please enter a valid street address.');
      }

      if (city.length < 2) {
        cityInput.setCustomValidity('Please enter a valid city.');
      }

      if (!/^[A-Z]{2}$/.test(state)) {
        stateInput.setCustomValidity('Please enter a 2-letter state code.');
      }

      if (!/^\d{5}(-\d{4})?$/.test(zip)) {
        zipInput.setCustomValidity('Please enter a valid zip code.');
      }
    }

    wirePhoneFormatting(phoneInput);
    wirePhoneFormatting(otherPartyPhoneInput);

    stateInput.addEventListener('input', () => {
      stateInput.value = stateInput.value.replace(/[^a-zA-Z]/g, '').toUpperCase().slice(0, 2);
    });

    zipInput.addEventListener('input', () => {
      zipInput.value = zipInput.value.replace(/[^\d-]/g, '').slice(0, 10);
    });

    streetAddressInput.addEventListener('input', validateAddressParts);
    cityInput.addEventListener('input', validateAddressParts);
    stateInput.addEventListener('input', validateAddressParts);
    zipInput.addEventListener('input', validateAddressParts);

    form.addEventListener('submit', (event) => {
      validateAddressParts();

      if (!form.checkValidity()) {
        event.preventDefault();
        form.reportValidity();
        formStatus.textContent = 'Please fix the required fields and try again.';
        formStatus.className = 'status error';
        return;
      }

      const derivedTimes = getDerivedTimes();
      hiddenDripjobsStart.value = derivedTimes.start;
      hiddenDripjobsEnd.value = derivedTimes.end;
      hiddenTimestamp.value = getCompactTimestamp();
      hiddenFullAddress.value = `${streetAddressInput.value.trim()}, ${cityInput.value.trim()}, ${stateInput.value.trim()}, ${zipInput.value.trim()}`;

      formStatus.textContent = 'Submitting...';
      formStatus.className = 'status success';
    });
  </script>
</body>
</html>
